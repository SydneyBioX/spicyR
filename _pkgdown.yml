url: https://sydneybiox.github.io/spicyR/

# spicyR 2 is built into /dev/ until it is released, so the live site keeps documenting the release.
development:
  mode: devel

# The look of the SydneyBioX Spatial Playbook (Quarto's cosmo theme, a light navbar with an orange-red rule;
# pkgdown/extra.css) and of spicyR 1.x (cosmo).
template:
  bootstrap: 5
  bootswatch: cosmo

navbar:
  bg: light
  structure:
    left: [intro, reference, news]
    right: [search, python, github]
  components:
    python:
      text: Python (spicyr)
      href: https://sydneybiox.github.io/spicyr-py

home:
  title: "spicyR: test whether cell types co-localise differently between groups of patients"
  description: >
    Test whether two cell types sit closer together in one group of patients than another, or with outcome,
    with patients as the units. In R and Python.

reference:
- title: "Test"
  desc: "Every pair of cell types, between conditions or with survival."
  contents:
  - spicy
  - kontextualTest
  - SpicyResults-class
  - topPairs
  - bind
- title: "Plot"
  contents:
  - signifPlot
  - spicyBoxPlot
  - plotImage
  - imageCrossPlot
- title: "Per-image statistics (image method)"
  desc: "Inputs and helpers for `spicy(method = \"image\")`, the original spicyR test."
  contents:
  - getPairwise
  - getPairwiseProp
  - getProp
  - convPairs
  - colTest
- title: "Data"
  contents:
  - diabetesData
  - spicyTest

articles:
- title: "Get started"
  navbar: ~
  contents:
  - spicyR
- title: "More"
  contents:
  - image_method

news:
  cran_dates: false
